<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Planner | My Daily Tasks</title>
    
    <!-- Import Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Import Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configure Tailwind for custom fonts and colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s ease-out',
                        'fade-in': 'fadeIn 0.3s ease-out',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS for specific overrides and animations -->
    <style>
        /* Custom Checkbox Styling */
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #d1d5db;
            border-radius: 0.35em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #10b981;
            border-color: #10b981;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Hide scrollbar for cleaner UI on list */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        .task-item {
            transition: all 0.3s ease;
        }
        .task-item.completed-task .task-text {
            text-decoration: line-through;
            color: #9ca3af;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-gray-800 font-sans antialiased selection:bg-brand-500 selection:text-white">

    <main class="container mx-auto px-4 py-8 md:py-12 flex justify-center min-h-screen items-start md:items-center">
        
        <!-- App Container -->
        <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden flex flex-col max-h-[90vh]">
            
            <!-- Header Section -->
            <header class="bg-brand-600 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] p-6 md:p-8 text-white rounded-t-3xl relative overflow-hidden">
                <!-- Decorative Circle -->
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"></div>
                
                <div class="relative z-10">
                    <h1 class="text-2xl md:text-3xl font-bold tracking-tight mb-1 flex items-center gap-2">
                        <span>👋</span> My Planner
                    </h1>
                    <p class="text-brand-100 text-sm font-medium">Crush your goals today!</p>
                    
                    <!-- Progress Bar -->
                    <div class="mt-5">
                        <div class="flex justify-between text-xs font-semibold mb-1 text-brand-50">
                            <span>Daily Progress</span>
                            <span id="progress-text">0%</span>
                        </div>
                        <div class="w-full bg-brand-700 rounded-full h-2.5 overflow-hidden">
                            <div id="progress-bar" class="bg-green-400 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Input Section -->
            <div class="p-6 border-b border-gray-100 bg-gray-50/50">
                <form id="task-form" class="space-y-3">
                    <div>
                        <input type="text" id="task-input" required placeholder="What do you need to do?" 
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all placeholder-gray-400 bg-white shadow-sm text-[15px]">
                    </div>
                    
                    <div class="flex gap-2">
                        <select id="category-select" class="flex-1 px-3 py-3 rounded-xl border border-gray-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all bg-white shadow-sm text-sm cursor-pointer appearance-none">
                            <option value="Homework">📚 Homework</option>
                            <option value="Study/WAEC Prep">📝 Study/WAEC Prep</option>
                            <option value="Computer Practicals">💻 Computer Practicals</option>
                            <option value="Chores">🧹 Chores</option>
                            <option value="Other">✨ Other</option>
                        </select>
                        
                        <button type="submit" class="bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white px-6 py-3 rounded-xl font-semibold shadow-md shadow-brand-200 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                            </svg>
                            Add
                        </button>
                    </div>
                </form>
            </div>

            <!-- Task List Section -->
            <div class="flex-1 overflow-y-auto p-6 no-scrollbar bg-white">
                
                <!-- Empty State (Hidden by default, shown via JS) -->
                <div id="empty-state" class="hidden flex-col items-center justify-center text-center py-10 animate-fade-in">
                    <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mb-4">
                        <span class="text-4xl">🚀</span>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-700 mb-1">All caught up!</h3>
                    <p class="text-sm text-gray-500 max-w-[200px]">Add your homework or chores above to get started.</p>
                </div>

                <!-- Dynamic List -->
                <ul id="task-list" class="space-y-3">
                    <!-- Tasks will be injected here via JavaScript -->
                </ul>
            </div>
            
        </div>
    </main>

    <script>
        // State variables
        let tasks = [];
        
        // DOM Elements
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const categorySelect = document.getElementById('category-select');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // Category configurations for badging
        const categoryConfig = {
            'Homework': { bg: 'bg-blue-100', text: 'text-blue-700', icon: '📚' },
            'Study/WAEC Prep': { bg: 'bg-rose-100', text: 'text-rose-700', icon: '📝' },
            'Computer Practicals': { bg: 'bg-teal-100', text: 'text-teal-700', icon: '💻' },
            'Chores': { bg: 'bg-amber-100', text: 'text-amber-700', icon: '🧹' },
            'Other': { bg: 'bg-gray-100', text: 'text-gray-700', icon: '✨' }
        };

        // Initialize App
        function init() {
            loadTasks();
            renderTasks();
            updateProgress();
            
            // Event Listeners
            taskForm.addEventListener('submit', handleAddTask);
        }

        // Load tasks from localStorage
        function loadTasks() {
            const savedTasks = localStorage.getItem('studentTasks');
            if (savedTasks) {
                try {
                    tasks = JSON.parse(savedTasks);
                } catch (e) {
                    console.error("Could not parse tasks from local storage", e);
                    tasks = [];
                }
            }
        }

        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('studentTasks', JSON.stringify(tasks));
            updateProgress();
        }

        // Handle adding a new task
        function handleAddTask(e) {
            e.preventDefault();
            
            const text = taskInput.value.trim();
            const category = categorySelect.value;
            
            if (!text) return;

            const newTask = {
                id: Date.now().toString(), // Simple unique ID
                text: text,
                category: category,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(newTask); // Add to beginning of array
            saveTasks();
            renderTasks();
            
            // Reset input
            taskInput.value = '';
            taskInput.focus();
        }

        // Toggle task completion status
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveTasks();
            renderTasks();
        }

        // Delete a task
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
        }

        // Render the task list
        function renderTasks() {
            // Handle empty state
            if (tasks.length === 0) {
                taskList.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            taskList.innerHTML = '';

            // Sort tasks: Incomplete first, then completed
            const sortedTasks = [...tasks].sort((a, b) => {
                if (a.completed === b.completed) return 0;
                return a.completed ? 1 : -1;
            });

            sortedTasks.forEach(task => {
                const li = document.createElement('li');
                const config = categoryConfig[task.category] || categoryConfig['Other'];
                
                li.className = `task-item animate-slide-up group flex items-start gap-3 p-4 bg-white border ${task.completed ? 'border-gray-100 bg-gray-50/50' : 'border-gray-200'} rounded-2xl shadow-sm hover:shadow-md transition-all ${task.completed ? 'completed-task' : ''}`;
                
                li.innerHTML = `
                    <div class="flex-shrink-0 mt-0.5">
                        <input type="checkbox" 
                            class="custom-checkbox" 
                            ${task.completed ? 'checked' : ''} 
                            onchange="toggleTask('${task.id}')"
                            aria-label="Mark task as complete">
                    </div>
                    
                    <div class="flex-1 min-w-0">
                        <p class="task-text text-gray-800 font-medium leading-tight mb-1.5 break-words text-[15px]">
                            ${escapeHTML(task.text)}
                        </p>
                        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold ${config.bg} ${config.text}">
                            <span>${config.icon}</span> ${task.category}
                        </span>
                    </div>
                    
                    <button onclick="deleteTask('${task.id}')" 
                        class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-red-500 hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-200 transition-colors"
                        title="Delete task"
                        aria-label="Delete task">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                `;
                
                taskList.appendChild(li);
            });
        }

        // Update progress bar
        function updateProgress() {
            if (tasks.length === 0) {
                progressBar.style.width = '0%';
                progressText.textContent = '0%';
                return;
            }

            const completedTasks = tasks.filter(task => task.completed).length;
            const percentage = Math.round((completedTasks / tasks.length) * 100);
            
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}%`;
            
            // Change color based on completion
            if (percentage === 100) {
                progressBar.className = 'h-2.5 rounded-full transition-all duration-500 ease-out bg-green-400';
            } else if (percentage > 50) {
                progressBar.className = 'h-2.5 rounded-full transition-all duration-500 ease-out bg-brand-400';
            } else {
                progressBar.className = 'h-2.5 rounded-full transition-all duration-500 ease-out bg-amber-400';
            }
        }

        // Utility: Prevent XSS
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Start the app when DOM is fully loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
